<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark circle background — visible in both light and dark browser chrome -->
  <circle cx="16" cy="16" r="15" fill="#1c1c1a"/>
  <!-- Clock ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#f2f2ed" stroke-width="1.5"/>
  <!-- Hour hand (pointing ~10 o'clock) -->
  <line x1="16" y1="16" x2="10.5" y2="10.5" stroke="#f2f2ed" stroke-width="2" stroke-linecap="round"/>
  <!-- Minute hand (pointing ~12) -->
  <line x1="16" y1="16" x2="16" y2="7.5" stroke="#f2f2ed" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#f2f2ed"/>
</svg>
